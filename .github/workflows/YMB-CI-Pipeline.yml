# This pipeline gives Ben Secure a Git-based record of every code change and test result for OSFI review.
# It runs tests on every push and pull request so failed code is caught before it reaches YMB production.
name: YMB Banking App CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: pytest test_main.py -v
